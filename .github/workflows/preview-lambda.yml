name: Preview — Lambda (feature branch)

# ─────────────────────────────────────────────────────────────────────────────
# Manual feature-branch preview on the parallel Lambda path (ADR-001 Option B).
#
# Purpose: exercise a feature branch on REAL Lambda infra *before* merging to
# main — without touching EC2 or main. deploy.yml builds+pushes the Lambda image
# but never runs `update-function-code` (done by hand today) and only triggers on
# workflow_run@main; this workflow closes that gap for previews.
#
# It OVERWRITES the shared wealthseva-backend-lambda function code — that function
# is the not-yet-cut-over parallel path (EC2 is still primary), so overwriting it
# with feature-branch code is the intended preview mechanism.
#
# Required GitHub Secrets (existing): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# The IAM user also needs (beyond current ECR/EC2): lambda:UpdateFunctionCode,
# lambda:GetFunction, lambda:GetFunctionConfiguration, lambda:GetFunctionUrlConfig.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to preview (branch/tag/SHA). Defaults to the branch this run is dispatched from."
        required: false
        default: ""

env:
  AWS_REGION:    ap-south-1
  ECR_REPO:      wealthseva-backend
  FUNCTION_NAME: wealthseva-backend-lambda

jobs:
  # ── 1. Quality gate — mirror ci.yml so a broken branch never reaches Lambda ──
  checks:
    name: Checks (mirror CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Backend: ruff + pytest (same as ci.yml backend-lint-test)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Backend lint
        run: cd backend && ruff check .
      - name: Backend test
        run: cd backend && pytest tests/ -v
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Frontend: npm ci → type-check → build (same as ci.yml frontend-lint-build)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Frontend type check
        run: cd frontend && npm run type-check
      - name: Frontend build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000

  # ── 2. Build Lambda image → update function → smoke test the FURL ───────────
  preview:
    name: Preview on Lambda
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Lambda preview image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Same recipe as deploy.yml build-and-push-lambda, but tagged
          # :preview-<sha> so it never collides with the main-line :lambda-* tags
          # and never pushes :lambda-latest.
          # --provenance=false: buildx otherwise wraps the single-platform image in
          # a manifest LIST (+ attestation); Lambda rejects manifest lists.
          PREVIEW_IMAGE_URI="${REGISTRY}/${ECR_REPO}:preview-${COMMIT_SHA}"

          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --file backend/Dockerfile.lambda \
            --tag "${PREVIEW_IMAGE_URI}" \
            .

          docker push "${PREVIEW_IMAGE_URI}"

          echo "image-uri=${PREVIEW_IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "✅ Pushed preview image: ${PREVIEW_IMAGE_URI}"

      - name: Update Lambda function code
        env:
          IMAGE_URI: ${{ steps.build.outputs.image-uri }}
        run: |
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --image-uri "${IMAGE_URI}" \
            --region "${AWS_REGION}" \
            --no-cli-pager
          echo "⏳ Waiting for function update to finish..."
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}"
          echo "✅ Lambda updated to preview image"

      - name: Discover Function URL
        id: furl
        run: |
          FURL=$(aws lambda get-function-url-config \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --query FunctionUrl --output text)
          # Strip any trailing slash so we can join paths cleanly.
          FURL="${FURL%/}"
          echo "url=${FURL}" >> "$GITHUB_OUTPUT"
          echo "🔗 Function URL: ${FURL}"

      - name: Smoke test the FURL (Bedrock-free)
        env:
          FURL: ${{ steps.furl.outputs.url }}
        run: |
          set -euo pipefail
          fail() { echo "❌ $1"; exit 1; }

          # 1. GET /health → 200
          echo "── 1. GET /health"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${FURL}/health")
          [ "$code" = "200" ] || fail "health expected 200, got $code"
          echo "✅ /health 200"

          # 2. POST /api/chat demo prompt → 200 + streamed body + X-Detected-Language: hi
          echo "── 2. POST /api/chat (demo stream, Hindi)"
          headers=$(mktemp); body=$(mktemp)
          code=$(curl -s -D "$headers" -o "$body" -w '%{http_code}' --max-time 60 \
            -X POST "${FURL}/api/chat" \
            -H 'Content-Type: application/json' \
            -d '{"message":"DEMO_MODE_SIP_HINDI","session_id":"preview-smoke","language":"hi","history":[]}')
          [ "$code" = "200" ] || fail "chat expected 200, got $code (body: $(cat "$body"))"
          grep -iq '^x-detected-language:[[:space:]]*hi' "$headers" \
            || fail "missing/incorrect X-Detected-Language header (want hi). Headers: $(cat "$headers")"
          [ -s "$body" ] || fail "chat body was empty (expected streamed content)"
          echo "✅ /api/chat 200 + X-Detected-Language: hi + non-empty stream"

          # 3. POST /api/chat with >2000-char message → 422 (input cap, pre-Bedrock)
          echo "── 3. POST /api/chat (oversized message → 422)"
          big=$(printf 'a%.0s' $(seq 1 2100))
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST "${FURL}/api/chat" \
            -H 'Content-Type: application/json' \
            -d "{\"message\":\"${big}\",\"session_id\":\"preview-smoke\",\"language\":\"en\",\"history\":[]}")
          [ "$code" = "422" ] || fail "oversized chat expected 422, got $code"
          echo "✅ /api/chat oversized → 422"

          # 4. Informational: GET /api/insights with no origin-verify header.
          #    403 iff ORIGIN_VERIFY_SECRET is set on the function; tolerate 200 when unset.
          echo "── 4. GET /api/insights (origin-verify gate, informational)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${FURL}/api/insights")
          if [ "$code" = "403" ]; then
            echo "ℹ️  /api/insights → 403 (ORIGIN_VERIFY_SECRET is set — gate active)"
          elif [ "$code" = "200" ]; then
            echo "ℹ️  /api/insights → 200 (ORIGIN_VERIFY_SECRET not set on function yet)"
          else
            echo "ℹ️  /api/insights → $code (unexpected, not failing the run)"
          fi

          echo "🎉 Smoke test passed"

      - name: Preview summary
        if: always()
        env:
          FURL: ${{ steps.furl.outputs.url }}
          IMAGE_URI: ${{ steps.build.outputs.image-uri }}
        run: |
          {
            echo "### 🔬 Lambda preview deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Function** | \`${FUNCTION_NAME}\` |"
            echo "| **Image** | \`${IMAGE_URI}\` |"
            echo "| **Function URL** | ${FURL} |"
            echo "| **Ref** | \`${{ github.event.inputs.ref || github.ref }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo ""
            echo "**Frontend (Amplify branch) env to paste:**"
            echo '```'
            echo "NEXT_PUBLIC_CHAT_URL=${FURL}/api/chat"
            echo "BACKEND_FURL_URL=${FURL}"
            echo 'NEXT_PUBLIC_BACKEND_URL='
            echo '```'
            echo ""
            echo "⚠️ This run **overwrote** the shared parallel-path Lambda "
            echo "(\`${FUNCTION_NAME}\`) with feature-branch code. EC2 and \`main\` were not touched."
          } >> "$GITHUB_STEP_SUMMARY"
