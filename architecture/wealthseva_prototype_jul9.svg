<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="990" viewBox="0 0 1760 990" font-family="Arial, Helvetica, sans-serif">
<title>WealthSeva AI — Prototype Architecture (Serverless), ap-south-1, 2026-07-12</title>
<desc>Current-state AWS serverless architecture after the 2026-07-11 EC2-to-Lambda cutover. Desktop and mobile browsers use two paths: streaming chat goes directly to a public Lambda Function URL; all other API calls go through the Amplify SSR proxy which injects an x-origin-verify header. The Lambda backend calls Amazon Bedrock (Claude 3.7 Sonnet, Titan Embeddings keyword-fallback), Secrets Manager, CloudWatch, and external SaaS (Supabase, Pinecone, Sarvam, ElevenLabs).</desc>
