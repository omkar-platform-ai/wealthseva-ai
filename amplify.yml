version: 1
# WealthSeva AI — Amplify Hosting build config
#
# Monorepo layout: this file lives at the repo root and points Amplify at the
# `frontend/` sub-directory (Next.js 14 App Router + next-intl middleware).
# Backend deploys separately via .github/workflows/deploy.yml to EC2.
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --prefer-offline --no-audit
        build:
          commands:
            # Amplify does not reliably expose console env vars to the Next.js
            # SSR runtime. Bake the server-side vars (read at runtime by the
            # /api proxy route) into .env.production so they survive into the
            # deployed compute. NEXT_PUBLIC_* are already inlined at build time.
            - env | grep -e '^BACKEND_FURL_URL=' -e '^ORIGIN_VERIFY_SECRET=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
